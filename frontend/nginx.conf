server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Always fetch the current application shell so OAuth redirects do not
  # resurrect an older frontend build from a browser/proxy cache.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires -1;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite content-hashed assets are safe to cache for a long time.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
}
